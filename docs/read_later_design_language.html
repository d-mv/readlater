<style>
:root{--brand-fill:#D85A30;--brand-tint:#FAECE7;--brand-on-tint:#993C1D;--brand-on:#fff}
[data-mode="dark"]{--brand-fill:#F0997B;--brand-tint:#4A1B0C;--brand-on-tint:#F0997B;--brand-on:#2C1006}
</style>
<h2 class="sr-only">Braun-inspired color system and components for the Read Later app</h2>

<div style="display:flex;gap:16px;margin-bottom:1.5rem;flex-wrap:wrap;">
<div><div style="width:56px;height:56px;border-radius:8px;background:var(--surface-1);"></div><p style="font-size:12px;color:var(--text-secondary);margin:6px 0 0;text-align:center;">Background</p></div>
<div><div style="width:56px;height:56px;border-radius:8px;background:var(--surface-2);border:0.5px solid var(--border);"></div><p style="font-size:12px;color:var(--text-secondary);margin:6px 0 0;text-align:center;">Surface</p></div>
<div><div style="width:56px;height:56px;border-radius:8px;background:var(--surface-2);border:1.5px solid var(--border-strong);"></div><p style="font-size:12px;color:var(--text-secondary);margin:6px 0 0;text-align:center;">Border</p></div>
<div><div style="width:56px;height:56px;border-radius:8px;background:var(--text-primary);"></div><p style="font-size:12px;color:var(--text-secondary);margin:6px 0 0;text-align:center;">Text</p></div>
<div><div style="width:56px;height:56px;border-radius:8px;background:var(--brand-fill);"></div><p style="font-size:12px;color:var(--text-secondary);margin:6px 0 0;text-align:center;">Accent</p></div>
</div>

<div style="display:flex;gap:12px;align-items:center;margin-bottom:1.5rem;">
<button style="background:var(--brand-fill);color:var(--brand-on);border:none;border-radius:var(--radius);padding:0 16px;height:36px;font-size:14px;font-weight:500;">Save to read later</button>
<button style="background:transparent;border:0.5px solid var(--border-strong);border-radius:var(--radius);padding:0 16px;height:36px;font-size:14px;color:var(--text-primary);">Archive</button>
<span style="background:var(--brand-tint);color:var(--brand-on-tint);padding:5px 12px;border-radius:999px;font-size:12px;font-weight:500;">3 unread</span>
</div>

<div style="display:flex;gap:20px;border-bottom:0.5px solid var(--border);padding-bottom:0;">
<span style="font-size:13px;font-weight:500;color:var(--text-primary);padding-bottom:8px;border-bottom:2px solid var(--brand-fill);">All</span>
<span style="font-size:13px;color:var(--text-secondary);padding-bottom:8px;">Archived</span>
</div>
