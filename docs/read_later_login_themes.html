<h2 class="sr-only">Read Later login screen shown in light and dark theme</h2>
<div style="display:flex;gap:20px;flex-wrap:wrap;">

<div style="flex:1;min-width:260px;">
<p style="font-size:12px;color:var(--text-muted);margin:0 0 8px;">Light</p>
<div style="background:#F5F4F2;border-radius:12px;border:0.5px solid #E3E1DB;padding:40px 24px;">
<p style="font-family:'Inter',sans-serif;font-size:18px;font-weight:500;color:#1A1A18;text-align:center;margin:0 0 4px;">Read Later</p>
<p style="font-size:13px;color:#6B6963;text-align:center;margin:0 0 24px;">Sign in to your archive</p>
<label style="font-size:12px;color:#6B6963;display:block;margin-bottom:4px;">Email</label>
<input type="email" placeholder="you@example.com" style="width:100%;height:40px;border-radius:8px;border:0.5px solid #E3E1DB;background:#FAFAF8;color:#1A1A18;padding:0 12px;font-size:14px;margin-bottom:12px;box-sizing:border-box;">
<label style="font-size:12px;color:#6B6963;display:block;margin-bottom:4px;">Password</label>
<input type="password" placeholder="••••••••" style="width:100%;height:40px;border-radius:8px;border:0.5px solid #E3E1DB;background:#FAFAF8;color:#1A1A18;padding:0 12px;font-size:14px;margin-bottom:20px;box-sizing:border-box;">
<button style="width:100%;height:40px;border-radius:8px;border:none;background:#D85A30;color:#fff;font-size:14px;font-weight:500;">Sign in</button>
</div>
</div>

<div style="flex:1;min-width:260px;">
<p style="font-size:12px;color:var(--text-muted);margin:0 0 8px;">Dark</p>
<div style="background:#1C1B19;border-radius:12px;border:0.5px solid #38362F;padding:40px 24px;">
<p style="font-family:'Inter',sans-serif;font-size:18px;font-weight:500;color:#F0EEE8;text-align:center;margin:0 0 4px;">Read Later</p>
<p style="font-size:13px;color:#A8A69E;text-align:center;margin:0 0 24px;">Sign in to your archive</p>
<label style="font-size:12px;color:#A8A69E;display:block;margin-bottom:4px;">Email</label>
<input type="email" placeholder="you@example.com" style="width:100%;height:40px;border-radius:8px;border:0.5px solid #38362F;background:#242320;color:#F0EEE8;padding:0 12px;font-size:14px;margin-bottom:12px;box-sizing:border-box;">
<label style="font-size:12px;color:#A8A69E;display:block;margin-bottom:4px;">Password</label>
<input type="password" placeholder="••••••••" style="width:100%;height:40px;border-radius:8px;border:0.5px solid #38362F;background:#242320;color:#F0EEE8;padding:0 12px;font-size:14px;margin-bottom:20px;box-sizing:border-box;">
<button style="width:100%;height:40px;border-radius:8px;border:none;background:#F0997B;color:#2C1006;font-size:14px;font-weight:500;">Sign in</button>
</div>
</div>

</div>
