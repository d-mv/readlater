# Cache policy per path, resolved once here so every response can share the
# server-level add_header block below. (A location with its own add_header
# drops all server-level ones — that would silently strip the security
# headers from exactly the responses that set a cache policy.)
map $uri $cache_control {
    ~^/assets/        "public, max-age=31536000, immutable";
    /index.html       "no-cache";
    /sw.js            "no-cache";
    /theme-init.js    "no-cache";
    default           "";
}

# Content-Security-Policy (the server block below). Why each origin is there:
# - script-src 'self': no inline scripts — the pre-paint theme script is the
#   file /theme-init.js and vite-plugin-pwa registers the SW from
#   /registerSW.js. md-editor runs with no-prettier/no-highlight so it never
#   injects unpkg.com scripts.
# - style-src 'self': the app's CSS ships as files, and Vue :style bindings go
#   through the CSSOM, which CSP doesn't gate. So style="" attributes stay
#   blocked (only article HTML carries them; they're dropped).
# - style-src-elem 'nonce-…': the editor's CodeMirror injects its theme as a
#   <style> element (style-mod) with runtime content, so no hash fits. nginx
#   mints the nonce: $request_id (128 random bits per request) goes into
#   this header and, via sub_filter below, into index.html's
#   <meta name="csp-nonce">, which the app hands to CodeMirror
#   (EditorView.cspNonce, src/lib/editor.ts). The service worker precaches
#   index.html together with its headers, so on an installed device one
#   nonce/header pair is reused until the next deploy re-precaches it —
#   still far tighter than 'unsafe-inline'. medium-zoom, the other <style>
#   injector in the editor, is aliased to its style-less build
#   (vite.config.ts). Article HTML can't add <style>: DOMPurify forbids it
#   (ArticleContent.vue). Browsers without style-src-elem (Safari < 15.4)
#   fall back to style-src and show the editor unstyled.
# - img-src https: data: blob: — articles hot-link images from any host;
#   blob: serves the offline copies from IndexedDB.
# - connect-src https: — the offline cache fetch()es every article image from
#   its original host. The Supabase project origin (REST, auth, storage, edge
#   functions) is covered by https: but named anyway, and its wss: origin
#   carries Realtime. VITE_SUPABASE_URL is a build arg (deploy.toml): keep the
#   two in sync if the project ever moves.
# - frame-src: the YouTube click-to-play embed (ArticleContent.vue), and
#   original PDFs shown in an iframe via a signed Storage URL on the
#   Supabase origin.
# - media-src https: blob: — <video>/<audio> that articles embed.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The only add_header block: no location below may add its own (see the
    # map comment above). An empty Cache-Control value sends no header.
    add_header Cache-Control $cache_control;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-elem 'self' 'nonce-$request_id'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self'; connect-src 'self' https: https://egkakmlkerlmsigoegoe.supabase.co wss://egkakmlkerlmsigoegoe.supabase.co; frame-src https://www.youtube-nocookie.com https://egkakmlkerlmsigoegoe.supabase.co; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    # TLS terminates at the reverse proxy in front of this container; the
    # header passes through to the HTTPS response, which is where it counts.
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        try_files $uri $uri/ /index.html;
        # The CSP nonce (see the CSP comment above); text/html only, i.e.
        # index.html and every SPA route that falls back to it.
        sub_filter '__CSP_NONCE__' $request_id;
        sub_filter_once on;
    }

    # Hashed build output: a miss is a 404, never the SPA shell.
    location /assets/ {
        try_files $uri =404;
    }
}
