<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Status-bar colour = the canvas of the theme actually applied; set by
         theme-init.js and kept in sync by stores/theme.ts. -->
    <meta name="theme-color" content="#EDEAE1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Read Later" />
    <!-- nginx replaces the placeholder per response; see src/lib/cspNonce.ts. -->
    <meta name="csp-nonce" content="__CSP_NONCE__" />
    <title>Read Later</title>
    <!-- Classic blocking script: the theme must be set before first paint. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
