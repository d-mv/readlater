pre-commit:
  parallel: true
  jobs:
    - name: lint-app
      root: "app/"
      glob: "*.{ts,vue}"
      run: bun run lint
    - name: lint-worker
      root: "worker/"
      glob: "*.ts"
      run: bun run lint
    - name: format-app
      root: "app/"
      glob: "*.{ts,vue,css,json}"
      run: bun run format:check
    - name: format-worker
      root: "worker/"
      glob: "*.ts"
      run: bun run format:check
    - name: format-bookmarklet
      root: "bookmarklet/"
      glob: "*.{ts,js}"
      run: bun run format:check
    - name: typecheck-app
      root: "app/"
      glob: "*.{ts,vue}"
      run: bun run typecheck
    - name: typecheck-worker
      root: "worker/"
      glob: "*.ts"
      run: bun run typecheck
    - name: unused-deps-app
      root: "app/"
      glob: "*.{ts,vue}"
      run: bun run unused-deps
    - name: unused-deps-worker
      root: "worker/"
      glob: "*.ts"
      run: bun run unused-deps
    - name: unused-deps-bookmarklet
      root: "bookmarklet/"
      glob: "*.{ts,js}"
      run: bun run unused-deps
    # Tests: every package with staged changes runs its whole suite, with the
    # 100% coverage gates. App changes also run the e2e suite; SQL changes
    # run the pgTAP suite (needs Docker; uses its own isolated stack).
    - name: test-app
      root: "app/"
      glob: "*.{ts,vue,css,json}"
      run: bun run test:coverage
    - name: test-worker
      root: "worker/"
      glob: "*.{ts,json,toml}"
      run: bun run test:coverage
    - name: test-bookmarklet
      root: "bookmarklet/"
      glob: "*.{ts,js,json,toml}"
      run: bun run test:coverage
    - name: check-functions
      root: "supabase/functions/"
      glob: "*.ts"
      run: deno check --frozen --node-modules-dir=none .
    - name: test-functions
      root: "supabase/functions/"
      glob: "*.ts"
      run: deno task coverage:functions
    # e2e and pgTAP one after the other: run together, the e2e suite times
    # out while the pgTAP stack and the build compete for the machine (the
    # same reason pre-push is piped). The rest still runs in parallel.
    - name: heavy-suites
      group:
        piped: true
        jobs:
          - name: test-e2e
            root: "app/"
            glob: "*.{ts,vue,css,json,html}"
            run: bun run test:e2e
          - name: test-db
            root: "supabase/"
            glob: "*.{sql,psql,sh,toml}"
            run: bash run-db-tests.sh

# Before anything leaves the machine: every suite, whatever changed. One at a
# time: run in parallel, the e2e suite times out while the pgTAP stack and the
# build compete for the machine.
pre-push:
  piped: true
  # No `root:` here: lefthook skips a rooted command when the push touches
  # no file under that root, and this hook must run every suite regardless.
  commands:
    test-app:
      run: bun run test:app
    test-worker:
      run: bun run test:worker
    test-bookmarklet:
      run: bun run test:bookmarklet
    test-functions:
      run: bun run test:functions
    build-app:
      run: cd app && bun run build
    test-e2e:
      run: bun run test:e2e
    test-db:
      run: bun run test:db
