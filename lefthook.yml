pre-commit:
  parallel: true
  commands:
    lint-app:
      root: "app/"
      glob: "*.{ts,vue}"
      run: bun run lint
    lint-worker:
      root: "worker/"
      glob: "*.ts"
      run: bun run lint
    format-app:
      root: "app/"
      glob: "*.{ts,vue,css,json}"
      run: bun run format:check
    format-worker:
      root: "worker/"
      glob: "*.ts"
      run: bun run format:check
    format-bookmarklet:
      root: "bookmarklet/"
      glob: "*.{ts,js}"
      run: bun run format:check
    typecheck-app:
      root: "app/"
      glob: "*.{ts,vue}"
      run: bun run typecheck
    typecheck-worker:
      root: "worker/"
      glob: "*.ts"
      run: bun run typecheck
    unused-deps-app:
      root: "app/"
      glob: "*.{ts,vue}"
      run: bun run unused-deps
    unused-deps-worker:
      root: "worker/"
      glob: "*.ts"
      run: bun run unused-deps
    unused-deps-bookmarklet:
      root: "bookmarklet/"
      glob: "*.{ts,js}"
      run: bun run unused-deps

    # Tests: every package with staged changes runs its whole suite, with the
    # 100% coverage gates. App changes also run the e2e suite; SQL changes
    # run the pgTAP suite (needs Docker; uses its own isolated stack).
    test-app:
      root: "app/"
      glob: "*.{ts,vue,css,json}"
      run: bun run test:coverage
    test-e2e:
      root: "app/"
      glob: "*.{ts,vue,css,json,html}"
      run: bun run test:e2e
    test-worker:
      root: "worker/"
      glob: "*.{ts,json,toml}"
      run: bun run test:coverage
    test-bookmarklet:
      root: "bookmarklet/"
      glob: "*.{ts,js,json,toml}"
      run: bun run test:coverage
    check-functions:
      root: "supabase/functions/"
      glob: "*.ts"
      run: deno check --frozen --node-modules-dir=none .
    test-functions:
      root: "supabase/functions/"
      glob: "*.ts"
      run: deno task coverage:functions
    test-db:
      root: "supabase/"
      glob: "*.{sql,psql,sh,toml}"
      run: bash run-db-tests.sh

# Before anything leaves the machine: every suite, whatever changed. One at a
# time: run in parallel, the e2e suite times out while the pgTAP stack and the
# build compete for the machine.
pre-push:
  piped: true
  commands:
    build-app:
      root: "app/"
      run: bun run build
    test-app:
      root: "app/"
      run: bun run test:coverage
    test-e2e:
      root: "app/"
      run: bun run test:e2e
    test-worker:
      root: "worker/"
      run: bun run test:coverage
    test-bookmarklet:
      root: "bookmarklet/"
      run: bun run test:coverage
    test-functions:
      run: deno task coverage:functions
    test-db:
      run: bun run test:db
