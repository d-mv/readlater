name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every suite runs with its 100% coverage gate (unit/integration), plus the
# Playwright e2e suite and the pgTAP database suite. Same commands as the
# lefthook pre-push hook.
jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run unused-deps
      - name: unit tests (100% coverage gate)
        run: bun run test:coverage
      - run: bun run build

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: app/playwright-report
          retention-days: 7

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # The browser-render tests drive a real headless Chromium.
      - run: bunx playwright install --with-deps chromium
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run unused-deps
      - name: tests (100% coverage gate)
        run: bun run test:coverage

  bookmarklet:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bookmarklet
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run unused-deps
      - name: tests (100% coverage gate)
        run: bun run test:coverage

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # --frozen: fail if an import isn't pinned in the committed deno.lock.
      # --node-modules-dir=none: the root package.json would otherwise make
      # Deno want a node_modules directory.
      - name: deno check
        run: deno check --frozen --node-modules-dir=none supabase/functions/
      - name: tests (100% coverage gate)
        run: deno task coverage:functions

  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - name: pgTAP database tests
        run: bash supabase/run-db-tests.sh
